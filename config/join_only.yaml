# ---------------------------------------------------------------------
# Join only: produce the input palm2gis reads.
# ---------------------------------------------------------------------
# palm2gis applies origin_x/origin_y, origin_z and the units itself, so
# it needs RAW PALM geometry and units. `joined` preserves both while
# stitching the restart-cycle parts into one file per product, which is
# why OUTPUT_join is the directory to point it at. The `analysis` output
# must NEVER be given to palm2gis: coordinates and units would be applied
# twice.
#
# Joining keeps every product, the surface output included, which the
# palm2gis `surfaces` stage needs. The analysis branch skips non-_av_xy /
# _av_3d files anyway, so a surface file never appears downstream.
#
#   python run_postproc.py -c config/join_only.yaml
#
# Then, in the palm2gis config:
#   input.data_3d:      ./OUTPUT_join/<case>_av_3d_N02.nc
#   input.surface_data: ./OUTPUT_join/<case>_av_surf_N02.nc

project:
    name: holesovice_stern_adapt
    root: /home/stern/palm/model.git/build/JOBS/{name}

input:
    palm_output: 'OUTPUT'

joined:
    dir: 'OUTPUT_join'

analysis:
    # The analysis branch is off. Give it a directory to also produce the
    # split and georeferenced files for QGIS and Python work; OUTPUT_join
    # survives either way, so both branches can come from one run.
    dir: null
