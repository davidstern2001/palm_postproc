# =====================================================================
# palm_postproc - template listing every configuration setting
# =====================================================================
#
# HOW TO READ THIS FILE
#   * Uncommented lines have no usable default and must be set.
#     #commented lines are optional and show the default.
#   * A key listed as `a | b` accepts exactly one of those values.
#   * Every output is its own block with a `dir:` line.
#       dir: 'OUTPUT_join'   -> produced
#       dir: null            -> skipped (as is a missing block)
#   * The config says WHAT you want out; the tool decides which internal
#     steps that needs (join -> splitvar -> splitz -> splittime -> coord).
#     Use --steps on the command line to run a subset.
#   * In paths, {name} is replaced by project.name.
#   * Paths are relative to project.root.
#   * An unknown or misspelt setting stops the run with a suggestion.
#   * Configs in the pre-0.6 layout (case / paths / steps / chain /
#     celsius) still load, unchanged.
#
# WHERE THIS OUTPUT GOES
#   PALM -> joined -+-> analysis
#                   +-> palm2gis (+ static driver)   (GIS, optional)
#   palm2gis reads `joined` output, never `analysis` output: it expects
#   the raw variable layout, kelvin, local coordinates and the full grid.
#
# Copy to config/<project>.yaml and run:
#   python run_postproc.py -c config/<project>.yaml


# ---------------------------------------------------------------------
# 1. PROJECT
# ---------------------------------------------------------------------
project:
    name: 'holesovice_stern_now'    # the PALM job name; {name} below
    root: '~/palm/model.git/build/JOBS/{name}'   # the PALM job directory
    #output_dir: '.'             # base for the output dirs (rel. to root)
    #overwrite: false            # false: keep outputs that are up to date
                                 # (resume state:
                                 # <root>/.palm_postproc_state.json)


# ---------------------------------------------------------------------
# 2. INPUT
# ---------------------------------------------------------------------
input:
    palm_output: 'OUTPUT'        # raw PALM OUTPUT, restart parts included
    #domain: null                # nested domain suffix, e.g. N02;
                                 # null = root domain
    #joined: null                # already-joined files; set this to skip
                                 # joining and start from them
    #crs: null                   # 'EPSG:32633'; null = read from the
                                 # files, else EPSG:32633 with a warning


# ---------------------------------------------------------------------
# 3. VARIABLES   what to keep
# ---------------------------------------------------------------------
# One file per variable, so a 3D file can be opened without loading the
# rest. `all` takes every variable; a list takes those names (wildcards
# allowed); `none` skips that file type.
variables:
    av_xy: all                   # e.g. [tsurf*_xy, ta_2m*_xy, bio_utci*_xy]
    av_3d: all                   # e.g. [u, v, w, theta, ta]
    #group: [u, v, w]            # written together as one file ...
    #group_suffix: uvw           # ... named <name>_<suffix>.nc


# ---------------------------------------------------------------------
# 4. REGION   what part of the domain to keep
# ---------------------------------------------------------------------
region:
    # Vertical extent, in metres ABOVE THE DOMAIN BASE: PALM's own z, the
    # zu_3d coordinate, with origin_z NOT added. Levels above it are cut;
    # null keeps every level. Directly comparable to palm_preproc's
    # nz x dz, which counts from the same base.
    #
    # palm2gis measures from a different reference (the terrain and
    # rooftops), so a file cut here cannot be extended there.
    #z_max: null


# ---------------------------------------------------------------------
# 5. TIME   which records to keep
# ---------------------------------------------------------------------
# Both ends inclusive; null = first / last record. Resolved against the
# file's own time axis, so files of different output interval cover the
# same period. Same syntax as palm2gis:
#   '2023-08-24 13:00'   absolute time
#   '13:00'              clock time, first occurrence after origin_time
#   '6h' / '90min'       offset from origin_time
#   3600                 seconds since origin_time
# Always QUOTE clock times: unquoted, YAML reads 13:00 as a number.
time:
    #from: null
    #to: null
    #step: null                  # e.g. '1h'; null = every record


# ---------------------------------------------------------------------
# 6. OUTPUTS
# ---------------------------------------------------------------------
joined:                          # restart parts stitched along time,
    dir: 'OUTPUT_join'           # one file per PALM output file.
                                 # Also the input for palm2gis.

analysis:                        # split by variable, cut, georeferenced
    dir: 'OUTPUT_post'
    #coordinates: utm            # utm | wgs84 | both
                                 # utm:   projected dimension coordinates
                                 #        + E_UTM / N_UTM aux variables
                                 # wgs84: adds 2-D auxiliary lat/lon on
                                 #        (y, x), CF-style. A PALM domain
                                 #        is regular in its PROJECTED CRS,
                                 #        so lon/lat cannot be 1-D
                                 #        dimension coordinates; the
                                 #        projected dims are always kept.
                                 # both:  UTM aux variables AND lat/lon


# ---------------------------------------------------------------------
# 7. ADVANCED   leave out unless you know you need it
# ---------------------------------------------------------------------
#advanced:

    # --- 7a. Units ----------------------------------------------------
    # The defaults are what the outputs should normally be: an air or
    # surface temperature in degrees C, a POTENTIAL temperature in K
    # (converting it would make the name meaningless). The same rule and
    # the same variable list as palm2gis, so a directory cannot end up
    # mixing units. Fill values are left untouched.
    #units:
        #temperature: C          # K | C - ta*, tsurf*, t_surf*
        #potential_temperature: K   # K only: theta* is kelvin-defined, so
                                 # a Celsius value would not be a potential
                                 # temperature

    # --- 7b. Performance ----------------------------------------------
    #performance:
        #complevel: 4            # zlib level 1-9 for every output file.
                                 # 1 is often 90% as small as 4 but 2-3x
                                 # faster.
        #workers: 4              # files processed in parallel. Each
                                 # worker holds a file open and chains it
                                 # in memory, so peak memory scales with
                                 # this: fine on a compute node, lower it
                                 # to 1-2 on a login node or for very
                                 # large 3D files.
        #keep_intermediate: false   # true: write each internal step's
                                 # output to its own directory instead of
                                 # chaining in memory (debugging)

    # --- 7c. Vertical coordinate --------------------------------------
    #z_coord: zu_3d              # the coordinate region.z_max is resolved
                                 # against (zu_3d | zw_3d)

    # --- 7d. Joining --------------------------------------------------
    #join:
        #files: all              # which PALM output files to join;
                                 # all = auto-detect. e.g.
                                 # ['{name}_av_xy_N02', '{name}_av_3d_N02']
        #naming: filenum         # how the restart parts are named:
                                 # filenum | dirpart | filepart |
                                 # filepattern | singlefile | tmpdir
        #file_prefix: ''
        #file_suffix: '.nc'      # keep .nc so later steps find the files
        #complevel: 6            # the join step's own zlib level
        #merge_tol: null         # seconds; timesteps closer together than
                                 # this are treated as one instant and
                                 # merged (the higher-numbered part wins).
                                 # null = a quarter of the median output
                                 # interval, capped at 1 s, which absorbs
                                 # the sub-second differences PALM writes
                                 # at restart-cycle boundaries. Raise it
                                 # only if your cycles disagree by more,
                                 # and check the joined time axis: merging
                                 # two genuine records loses one of them.
        # Rarely needed, kept from the original script:
        #create_new_file: true
        #offset_min: 0
        #part_timeshift: 0
        #output_timestep: 0
